    <script>
      // Suppress Vite HMR WebSocket error reports per environment guidelines
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.message.includes('createWebSocketModuleRunnerTransport'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          String(e.reason).includes('WebSocket') ||
          String(e.reason).includes('@vite/client') ||
          String(e.reason).includes('createWebSocketModuleRunnerTransport')
        )) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
